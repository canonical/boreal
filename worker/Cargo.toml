[workspace]
resolver = "3"

[package]
name = "boreal-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[features]
schema = ["dep:schemars", "dep:serde_json", "dep:validator"]

[lib]
path = "lib.rs"

[dependencies]
schemars = { version = "1", optional = true, features = ["preserve_order"] }
serde_json = { version = "1", optional = true }
temporalio-client = "~1.2.0"
temporalio-common = "~1.2.0"
temporalio-macros = "~1.2.0"
temporalio-sdk = "~1.2.0"
temporalio-workflow = "~1.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
validator = { version = "0.20", optional = true, features = ["derive"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
