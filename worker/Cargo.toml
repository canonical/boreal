[workspace]
members = ["catalog"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[package]
name = "boreal-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
schema = ["dep:boreal-schema", "dep:schemars", "dep:validator"]
read-secrets = []

[lib]
path = "lib.rs"

[dependencies]
boreal-schema = { path = "catalog", optional = true }
schemars = { version = "1", optional = true, features = ["preserve_order"] }
temporalio-client = "~1.2.0"
temporalio-common = "~1.2.0"
temporalio-macros = "~1.2.0"
temporalio-sdk = "~1.2.0"
temporalio-workflow = "~1.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
validator = { version = "0.20", optional = true, features = ["derive"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
