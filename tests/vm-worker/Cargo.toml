[workspace]
members = ["vault"]
resolver = "3"

[package]
name = "lab-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "greet"
path = "src/bin/greet.rs"

[[bin]]
name = "greet-schedule"
path = "src/bin/greet-schedule.rs"

[[bin]]
name = "count"
path = "src/bin/count.rs"

[[bin]]
name = "schema"
path = "src/bin/schema.rs"

[dependencies]
boreal-sdk = { path = "../.boreal/boreal-sdk", features = ["schema"] }
futures = "0.3"
schemars = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
validator = { version = "0.20", features = ["derive"] }
temporalio-client = "~1.2.0"
temporalio-common = "~1.2.0"
temporalio-macros = "~1.2.0"
temporalio-sdk = "~1.2.0"
temporalio-workflow = "~1.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
