[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[package]
name = "boreal-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "boreal-shell"
path = "main.rs"

[dependencies]
boreal-common = { path = "../common" }
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
crossterm = "0.29"
nu-ansi-term = "0.50"
reedline = "0.49"
shlex = "1.3"
uuid = { version = "1", features = ["v4"] }
