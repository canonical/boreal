[workspace]
members = ["lab-core", "lab-worker", "lab-worker-alt", "lab-client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
boreal-worker = { path = "../.boreal/boreal-worker", features = ["schema"] }
futures = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
temporalio-client = "~1.2.0"
temporalio-common = "~1.2.0"
temporalio-macros = "~1.2.0"
temporalio-sdk = "~1.2.0"
temporalio-workflow = "~1.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
