[workspace]
members = ["demo-core", "demo-desk", "demo-dispatch", "demo-vault"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
boreal-sdk = { path = "../.boreal/boreal-sdk" }
demo-core = { path = "demo-core" }
futures = "0.3"
schemars = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
temporalio-client = "~1.2.0"
temporalio-common = "~1.2.0"
temporalio-macros = "~1.2.0"
temporalio-sdk = "~1.2.0"
temporalio-workflow = "~1.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
