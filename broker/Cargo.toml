[workspace]
resolver = "3"

[package]
name = "boreal-broker"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[[bin]]
name = "boreal-broker"
path = "main.rs"

[dependencies]
boreal-common = { path = "../common" }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
serde_json = "1"
temporalio-common = "~1.2.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen"] }
uuid = { version = "1", features = ["v4"] }
