[workspace]
resolver = "3"

[package]
name = "boreal-common"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
path = "lib.rs"

[dependencies]
jsonschema = { version = "0.61", default-features = false, features = ["arbitrary-precision"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
