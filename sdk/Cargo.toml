[workspace]
members = ["catalog"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[package]
name = "boreal-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
schema = ["dep:boreal-schema", "dep:schemars", "dep:temporalio-common", "dep:temporalio-workflow"]
read-secrets = []

[lib]
path = "lib.rs"

[dependencies]
boreal-schema = { path = "catalog", optional = true }
schemars = { version = "1", optional = true, features = ["preserve_order"] }
temporalio-client = "~1.2.0"
temporalio-common = { version = "~1.2.0", optional = true }
temporalio-sdk = "~1.2.0"
temporalio-workflow = { version = "~1.2.0", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
temporalio-macros = "~1.2.0"
