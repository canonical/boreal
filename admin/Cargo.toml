[workspace]
resolver = "3"

[package]
name = "boreal-admin"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[[bin]]
name = "boreal-admin"
path = "shell.rs"

[[bin]]
name = "boreal-admin-ctl"
path = "ctl.rs"

[dependencies]
boreal-common = { path = "../common" }
boreal-shell = { path = "../shell", default-features = false }
clap = { version = "4.5", features = ["derive", "string"] }
shlex = "1.3"
